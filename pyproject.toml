[build-system]
requires = [
  "cmake>=3.26.1",
  "ninja",
  "packaging>=24.2",
  "setuptools>=77.0.3,<81.0.0",
  "wheel",
  "jinja2",
]
build-backend = "setuptools.build_meta"

[project]
name = "vllm"
authors = [{ name = "vLLM Team" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
description = "A high-throughput and memory-efficient inference and serving engine for LLMs"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10,<3.14"
version = "0.19.1"
dependencies = [
  "regex", # Replace re for higher-performance regex matching
  "cachetools",
  "psutil",
  "sentencepiece", # Required for LLaMA tokenizer.
  "numpy",
  "requests >= 2.26.0",
  "tqdm",
  "blake3",
  "py-cpuinfo",
  "transformers >= 4.56.0, != 5.0.*, != 5.1.*, != 5.2.*, != 5.3.*, != 5.4.*, != 5.5.0",
  "tokenizers >= 0.21.1", # Required for fast incremental detokenization.
  "protobuf >= 5.29.6, !=6.30.*, !=6.31.*, !=6.32.*, !=6.33.0.*, !=6.33.1.*, !=6.33.2.*, !=6.33.3.*, !=6.33.4.*", # Required by LlamaTokenizer, gRPC. CVE-2026-0994
  "fastapi[standard] >= 0.115.0", # Required by FastAPI's form models in the OpenAI API server's audio transcriptions endpoint.
  "aiohttp >= 3.13.3",
  "openai >= 2.0.0", # For Responses API with reasoning content
  "pydantic >= 2.12.0",
  "prometheus_client >= 0.18.0",
  "pillow", # Required for image processing
  "prometheus-fastapi-instrumentator >= 7.0.0",
  "tiktoken >= 0.6.0", # Required for DBRX tokenizer
  "lm-format-enforcer == 0.11.3",
  "llguidance >= 1.3.0, < 1.4.0; platform_machine == 'x86_64' or platform_machine == 'arm64' or platform_machine == 'aarch64' or platform_machine == 's390x' or platform_machine == 'ppc64le'",
  "outlines_core == 0.2.11",
  "diskcache == 5.6.3", # required for outlines backend disk cache
  "lark == 1.2.2",
  "xgrammar >= 0.1.32, < 1.0.0; platform_machine == 'x86_64' or platform_machine == 'aarch64' or platform_machine == 'arm64' or platform_machine == 's390x' or platform_machine == 'ppc64le'",
  "typing_extensions >= 4.10",
  "filelock >= 3.16.1", # need to contain https://github.com/tox-dev/filelock/pull/317
  "partial-json-parser", # used for parsing partial JSON outputs
  "pyzmq >= 25.0.0",
  "msgspec",
  "gguf >= 0.17.0",
  "mistral_common[image] >= 1.10.0",
  "opencv-python-headless >= 4.13.0", # required for video IO
  "pyyaml",
  "six>=1.16.0; python_version > '3.11'", # transitive dependency of pandas that needs to be the latest version for python 3.12
  "setuptools>=77.0.3,<81.0.0; python_version > '3.11'", # Setuptools is used by triton, we need to ensure a modern version is installed for 3.12+ so that it does not try to import distutils, which was removed in 3.12
  "einops", # Required for Qwen2-VL.
  #"compressed-tensors == 0.15.0.1", # required for compressed-tensors
  "depyf==0.20.0", # required for profiling and debugging with compilation config
  "cloudpickle", # allows pickling lambda functions in model_executor/models/registry.py
  "watchfiles", # required for http server to monitor the updates of TLS files
  "python-json-logger", # Used by logging as per examples/others/logging_configuration.md
  "ninja", # Required for xgrammar, rocm, tpu, xpu
  "pybase64", # fast base64 implementation
  "cbor2", # Required for cross-language serialization of hashable objects
  "ijson", # Required for mistral streaming tool parser
  "setproctitle", # Used to set process names for better debugging and monitoring
  "openai-harmony >= 0.0.3", # Required for gpt-oss
  "anthropic >= 0.71.0",
  "model-hosting-container-standards >= 0.1.13, < 1.0.0",
  "mcp",
  "opentelemetry-sdk >= 1.27.0",
  "opentelemetry-api >= 1.27.0",
  "opentelemetry-exporter-otlp >= 1.27.0",
  "opentelemetry-semantic-conventions-ai >= 0.4.1",
]

[project.optional-dependencies]
cpu = [ # todo
]
cuda12 = [
  # added for exo
  "compressed-tensors == 0.15.0.1", # required for compressed-tensors

  # more normal
  "numba == 0.61.2 ", # Required for N-gram speculative decoding

  # Dependencies for NVIDIA GPUs
  "torch==2.10.0",
  "torchaudio==2.10.0",
  # These must be updated alongside torch
  "torchvision==0.25.0", # Required for phi3v processor. See https://github.com/pytorch/vision?tab=readme-ov-file#installation for corresponding version
  # FlashInfer should be updated together with the Dockerfile
  "flashinfer-python==0.6.6",
  "flashinfer-cubin==0.6.6",
  # Cap nvidia-cudnn-frontend (transitive dep of flashinfer) due to
  # breaking changes in 1.19.0
  "nvidia-cudnn-frontend>=1.13.0,<1.19.0",

  # QuACK and Cutlass DSL for FA4 (cute-DSL implementation)
  "nvidia-cutlass-dsl>=4.4.0.dev1",
  "quack-kernels>=0.2.7",
]
cuda13 = [
  # added for exo
  "compressed-tensors == 0.15.0.1", # required for compressed-tensors

  # more normal
  "numba == 0.61.2 ", # Required for N-gram speculative decoding

  # Dependencies for NVIDIA GPUs
  "torch==2.10.0",
  "torchaudio==2.10.0",
  # These must be updated alongside torch
  "torchvision==0.25.0", # Required for phi3v processor. See https://github.com/pytorch/vision?tab=readme-ov-file#installation for corresponding version
  # FlashInfer should be updated together with the Dockerfile
  "flashinfer-python==0.6.6",
  "flashinfer-cubin==0.6.6",
  # Cap nvidia-cudnn-frontend (transitive dep of flashinfer) due to
  # breaking changes in 1.19.0
  "nvidia-cudnn-frontend>=1.13.0,<1.19.0",

  # QuACK and Cutlass DSL for FA4 (cute-DSL implementation)
  "nvidia-cutlass-dsl>=4.4.0.dev1",
  "quack-kernels>=0.2.7",
]
rocm = [ #todo
]
xpu = [ #todo
]
# AMD Zen CPU optimizations via zentorch
zen = ["zentorch"]
bench = ["pandas", "matplotlib", "seaborn", "datasets", "scipy", "plotly"]
tensorizer = ["tensorizer==2.10.1"]
fastsafetensors = ["fastsafetensors >= 0.2.2"]
instanttensor = ["instanttensor >= 0.1.5"]
runai = ["runai-model-streamer[s3,gcs,azure] >= 0.15.7"]
audio = [
  "av",
  "resampy",
  "scipy",
  "soundfile",
  "mistral_common[audio]",
] # Required for audio processing
video = [] # Kept for backwards compatibility
flashinfer = [] # Kept for backwards compatibility
# Optional deps for AMD FP4 quantization support
petit-kernel = ["petit-kernel"]
# Optional deps for Helion kernel development
helion = ["helion==0.3.2"]
# Optional deps for gRPC server (vllm serve --grpc)
grpc = ["smg-grpc-servicer[vllm] >= 0.5.0"]
# Optional deps for OpenTelemetry tracing
otel = [
  "opentelemetry-sdk>=1.26.0",
  "opentelemetry-api>=1.26.0",
  "opentelemetry-exporter-otlp>=1.26.0",
  "opentelemetry-semantic-conventions-ai>=0.4.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "extra == 'cuda13'" },
  { index = "pytorch-cu128", marker = "extra != 'cuda13' and extra == 'cuda12'" },
  { index = "pytorch-cpu", marker = "extra != 'cuda13' and extra != 'cuda12'" },
]
torchaudio = [
  { index = "pytorch-cu130" },
]
torchvision = [
  { index = "pytorch-cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.urls]
Homepage = "https://github.com/vllm-project/vllm"
Documentation = "https://docs.vllm.ai/en/latest/"
Slack = "https://slack.vllm.ai/"

[project.scripts]
vllm = "vllm.entrypoints.cli.main:main"

[project.entry-points."vllm.general_plugins"]
lora_filesystem_resolver = "vllm.plugins.lora_resolvers.filesystem_resolver:register_filesystem_resolver"
lora_hf_hub_resolver = "vllm.plugins.lora_resolvers.hf_hub_resolver:register_hf_hub_resolver"

[tool.setuptools.packages.find]
where = ["."]
include = ["vllm*"]

[tool.ruff.lint.per-file-ignores]
"vllm/third_party/**" = ["ALL"]
"vllm/version.py" = ["F401"]
"vllm/_version.py" = ["ALL"]

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-implicit-str-concat
  "ISC",
  # flake8-simplify
  "SIM",
  # isort
  "I",
  # flake8-logging-format
  "G",
]
ignore = [
  # star imports
  "F405",
  "F403",
  # lambda expression assignment
  "E731",
  # zip without `strict=`
  "B905",
  # Loop control variable not used within loop body
  "B007",
  # f-string format
  "UP032",
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
plugins = ['pydantic.mypy']
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"

[tool.pytest.ini_options]
markers = [
  "slow_test",
  "skip_global_cleanup",
  "core_model: enable this model test in each PR instead of only nightly",
  "hybrid_model: models that contain mamba layers (including pure SSM and hybrid architectures)",
  "cpu_model: enable this model test in CPU tests",
  "cpu_test: mark test as CPU-only test",
  "split: run this test as part of a split",
  "distributed: run this test only in distributed GPU tests",
  "optional: optional tests that are automatically skipped, include --optional to run them",
]

[tool.ty.src]
respect-ignore-files = true

[tool.ty.environment]
python = "./.venv"

[tool.typos.files]
# these files may be written in non english words
extend-exclude = [
  "tests/models/fixtures/*",
  "tests/prompts/*",
  "tests/tokenizers_/*",
  "benchmarks/sonnet.txt",
  "tests/lora/data/*",
  "examples/pooling/token_embed/*",
  "build/*",
  "vllm/third_party/*",
  "vllm/entrypoints/serve/instrumentator/static/*",
  "tests/entrypoints/openai/speech_to_text/test_transcription_validation.py",
  "docs/governance/process.md",
  "tests/v1/engine/test_fast_incdec_prefix_err.py",
  ".git/*",
]
ignore-hidden = false

[tool.typos.default]
extend-ignore-identifiers-re = [".*[Uu][Ee][0-9][Mm][0-9].*"]

[tool.typos.default.extend-identifiers]
bbc5b7ede = "bbc5b7ede"
NOOPs = "NOOPs"
nin_shortcut = "nin_shortcut"
cudaDevAttrMaxSharedMemoryPerBlockOptin = "cudaDevAttrMaxSharedMemoryPerBlockOptin"

depthwise_seperable_out_channel = "depthwise_seperable_out_channel"
pard_token = "pard_token"
ptd_token_id = "ptd_token_id"
ser_de = "ser_de"
shared_memory_per_block_optin = "shared_memory_per_block_optin"
FoPE = "FoPE"
k_ot = "k_ot"
view_seperator = "view_seperator"
inverse_std_variences = "inverse_std_variences"

[tool.typos.default.extend-words]
iy = "iy"
indx = "indx"
# intel cpu features
tme = "tme"
dout = "dout"
Pn = "Pn"
arange = "arange"
thw = "thw"
subtile = "subtile"
HSA = "HSA"
setp = "setp"
CPY = "CPY"
thr = "thr"
Thr = "Thr"
PARD = "PARD"
pard = "pard"
AKS = "AKS"
ba = "ba"
fo = "fo"
nd = "nd"
eles = "eles"
datas = "datas"
ser = "ser"
ure = "ure"
